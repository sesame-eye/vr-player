<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>360 VR Player</title>

<!-- iOS用 ホーム画面追加時の全画面化設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="360 VR Player">

<!-- Android (Chrome) 用 全画面化設定 -->
<meta name="mobile-web-app-capable" content="yes">

<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; height:100%; width:100%; }
  #ui-container {
    position:absolute; top:20px; left:20px; z-index:999;
    background:rgba(255,255,255,0.9); padding:12px; border-radius:8px;
    font-family:sans-serif; display:flex; flex-direction:column; gap:10px;
  }
  button {
    padding:10px 16px; font-size:14px; font-weight:bold;
    background:#007aff; color:#fff; border:none; border-radius:4px; cursor:pointer;
  }
  button:disabled { background:#ccc; }
  #vr-toggle-btn {
    position:absolute; bottom:20px; right:20px; z-index:999;
    display:none;
  }
  /* 操作インジケーター表示用 */
  #action-indicator {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000; color: #fff; background: rgba(0,0,0,0.6);
    padding: 16px 28px; border-radius: 12px; font-size: 24px;
    font-weight: bold; font-family: sans-serif;
    pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
  }
  canvas { display:block; }
</style>
</head>
<body>

<div id="ui-container">
  <input type="file" id="video-file" accept="video/mp4,video/*">
  <button id="play-btn" disabled>再生開始</button>
</div>

<button id="vr-toggle-btn">VR(2画面)切替</button>
<div id="action-indicator"></div>

<video id="video-src" playsinline webkit-playsinline loop muted
  style="position:absolute; width:1px; height:1px; opacity:0.01; pointer-events:none;"></video>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
<script>
const fileInput = document.getElementById('video-file');
const playBtn = document.getElementById('play-btn');
const vrToggleBtn = document.getElementById('vr-toggle-btn');
const video = document.getElementById('video-src');
const uiContainer = document.getElementById('ui-container');
const actionIndicator = document.getElementById('action-indicator');

let scene, camera, renderer, stereoEffect, deviceControls;
let isStereoMode = false;
let deviceOrientationEnabled = false;

// タッチドラッグ用(ジャイロ許可が得られない場合のフォールバック)
let lon = 0, lat = 0;
let isPointerDown = false, pointerX = 0, pointerY = 0, lonStart = 0, latStart = 0;

let normalFov = 75;
let stereoFov = 95;

// タップ・長押し（ポインター操作）制御用の変数
let pressTimer = null;
let longPressTriggered = false;
let startX = 0, startY = 0;

function showIndicator(text) {
  actionIndicator.textContent = text;
  actionIndicator.style.opacity = '1';
  setTimeout(() => {
    actionIndicator.style.opacity = '0';
  }, 800);
}

function initScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(normalFov, window.innerWidth / window.innerHeight, 0.1, 1100);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  stereoEffect = new THREE.StereoEffect(renderer);
  stereoEffect.setSize(window.innerWidth, window.innerHeight);
  stereoEffect.eyeSeparation = 0.008;

  const geometry = new THREE.SphereGeometry(500, 128, 128);
  geometry.scale(-1, 1, 1);

  const videoTexture = new THREE.VideoTexture(video);
  videoTexture.minFilter = THREE.LinearFilter;
  videoTexture.magFilter = THREE.LinearFilter;
  videoTexture.format = THREE.RGBFormat;

  const material = new THREE.MeshBasicMaterial({ map: videoTexture });
  const sphere = new THREE.Mesh(geometry, material);
  
  sphere.rotation.y = Math.PI / 2;
  scene.add(sphere);

  deviceControls = new THREE.DeviceOrientationControls(camera);

  window.addEventListener('resize', onResize);
  
  // ポインターイベントの登録（タップ・一時停止・長押し10秒スキップ）
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  renderer.domElement.addEventListener('pointercancel', onPointerUp);

  vrToggleBtn.style.display = 'block';
  vrToggleBtn.addEventListener('click', toggleStereo);

  animate();
}

function toggleStereo(e) {
  if (e) e.stopPropagation(); // キャンバス上のタップイベント伝播を防止
  isStereoMode = !isStereoMode;

  camera.fov = isStereoMode ? stereoFov : normalFov;
  camera.updateProjectionMatrix();

  if (isStereoMode) {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  } else {
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  }

  setTimeout(onResize, 300);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  stereoEffect.setSize(window.innerWidth, window.innerHeight);
}

function onPointerDown(e) {
  isPointerDown = true;
  pointerX = e.clientX; pointerY = e.clientY;
  startX = e.clientX; startY = e.clientY;
  lonStart = lon; latStart = lat;

  longPressTriggered = false;

  // 0.5秒間押し続けたら「10秒スキップ」を実行
  pressTimer = setTimeout(() => {
    if (isPointerDown) {
      longPressTriggered = true;
      if (video && !isNaN(video.duration)) {
        video.currentTime = Math.min(video.duration, video.currentTime + 10);
        showIndicator('⏩ +10秒');
      }
    }
  }, 500);
}

function onPointerMove(e) {
  if (!isPointerDown) return;

  // 移動距離を算出
  const diffX = Math.abs(e.clientX - startX);
  const diffY = Math.abs(e.clientY - startY);

  // 指が一定（10px）以上動いたら「視点移動操作」とみなし長押し判定をキャンセル
  if (diffX > 10 || diffY > 10) {
    clearTimeout(pressTimer);
  }

  if (!deviceOrientationEnabled) {
    lon = (pointerX - e.clientX) * 0.1 + lonStart;
    lat = (e.clientY - pointerY) * 0.1 + latStart;
  }
}

function onPointerUp(e) {
  isPointerDown = false;
  clearTimeout(pressTimer);

  // 長押しが動いていなかった場合＝短くタップされた時は「一時停止 / 再生」の切り替え
  if (!longPressTriggered) {
    const diffX = Math.abs((e ? e.clientX : startX) - startX);
    const diffY = Math.abs((e ? e.clientY : startY) - startY);

    // ドラッグ移動ではなくタップの場合のみ実行
    if (diffX <= 10 && diffY <= 10) {
      if (video.paused) {
        video.play();
        showIndicator('▶ 再生');
      } else {
        video.pause();
        showIndicator('⏸ 一時停止');
      }
    }
  }
}

function animate() {
  requestAnimationFrame(animate);

  if (deviceOrientationEnabled && deviceControls) {
    deviceControls.update();
  } else {
    lat = Math.max(-85, Math.min(85, lat));
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    camera.position.x = 0.1 * Math.sin(phi) * Math.cos(theta);
    camera.position.y = 0.1 * Math.cos(phi);
    camera.position.z = 0.1 * Math.sin(phi) * Math.sin(theta);
    camera.lookAt(0, 0, 0);
  }

  if (isStereoMode) {
    stereoEffect.render(scene, camera);
  } else {
    renderer.render(scene, camera);
  }
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  video.src = URL.createObjectURL(file);
  video.load();
  playBtn.disabled = false;
  playBtn.textContent = 'タップして再生';
});

playBtn.addEventListener('click', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(res => {
      if (res === 'granted') {
        if (deviceControls) deviceControls.connect();
        deviceOrientationEnabled = true;
      }
    }).catch(console.warn);
  }

  video.muted = false;
  const start = () => {
    video.play().then(() => {
      uiContainer.style.display = 'none';
      if (!scene) {
        initScene();
        if (typeof DeviceOrientationEvent === 'undefined' ||
            typeof DeviceOrientationEvent.requestPermission !== 'function') {
          deviceControls.connect();
          deviceOrientationEnabled = true;
        }
      }
    }).catch(err => alert('再生エラー: ' + err.message));
  };

  if (video.readyState >= 2) start();
  else video.addEventListener('loadeddata', start, { once: true });
});
</script>
</body>
</html>
