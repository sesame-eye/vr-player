<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360 VR Player</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px;
      border-radius: 8px;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

  <div id="ui-container">
    <input type="file" id="video-file" accept="video/mp4,video/*">
    <button id="play-btn" disabled>再生開始</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: true">
    <a-assets>
      <video id="video-src" loop playsinline webkit-playsinline muted></video>
    </a-assets>
    <a-videosphere id="sphere" src="#video-src" rotation="0 -90 0"></a-videosphere>
    <a-camera look-controls="magicWindowTrackingEnabled: true"></a-camera>
  </a-scene>

  <script>
    const fileInput = document.getElementById('video-file');
    const playBtn = document.getElementById('play-btn');
    const video = document.getElementById('video-src');
    const sphere = document.getElementById('sphere');
    const uiContainer = document.getElementById('ui-container');

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileURL = URL.createObjectURL(file);
      video.src = fileURL;
      video.load();
      playBtn.disabled = false;
      playBtn.textContent = 'タップして再生';
    });

    playBtn.addEventListener('click', function() {
      // ミュート解除して再生
      video.muted = false;
      video.play().then(() => {
        uiContainer.style.display = 'none';
        
        // iOS Safari向け: 毎フレーム強制的にテクスチャを更新させる処理
        const scene = document.querySelector('a-scene');
        scene.addEventListener('render-target-loaded', () => {}, {once: true});
        
        function updateTexture() {
          if (sphere.components.material && sphere.components.material.material.map) {
            sphere.components.material.material.map.needsUpdate = true;
          }
          if (!video.paused && !video.ended) {
            requestAnimationFrame(updateTexture);
          }
        }
        updateTexture();

      }).catch(err => {
        alert('再生エラー: ' + err.message);
      });
    });
  </script>
</body>
</html>
